name: deploy on push (production)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set directory permissions (allow upload)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER_NAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: sudo chown -R ubuntu:ubuntu /var/www/html

      - name: Copy website files to production server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER_NAME }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "./html/*"
          target: "/var/www/html"
          strip_components: 1

      - name: Restore root permissions (security)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER_NAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: sudo chown -R root:root /var/www/html